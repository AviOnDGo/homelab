version: "3.8"

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - REQUIRE_API_KEY=true
      - ALLOW_API_KEY_REVEAL=false
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - omniroute_filedata:/app/data
    networks:
      - ai_network
      - security_network
    restart: unless-stopped

volumes:
  omniroute_filedata:
    external: true
    name: omniroute_filedata

networks:
  ai_network:
    external: true
    name: ai_network
  security_network:
    external: true
    name: security_network
