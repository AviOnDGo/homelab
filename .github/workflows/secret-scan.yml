name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write  # Add this for gitleaks to report findings

jobs:
  local-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test local secret gates
        run: python3 -m unittest discover -s .secret-scanning/tests -v

  gitleaks:
    uses: AviOnDGo/AviOnDGo/.github/workflows/secret-scan.yml@6e0332715bb6a5ff7947b0268243d02790e12fce