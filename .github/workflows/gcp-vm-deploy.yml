name: Deploy GCP VM Terraform

on:
  push:
    branches:
      - main
    paths:
      - "googleCloud/**/*.tf"
      - "googleCloud/**/*.tfvars"
      - ".github/workflows/gcp-vm-deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      enforce_main_guard:
        description: "Keep apply/destroy restricted to main/workflow ref (set false only for temporary testing)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      allow_vm_replacement:
        description: "Allow a reviewed VM replacement (destroys the existing boot disk)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_vm_service_account_email: ${{ vars.GCP_SERVICE_ACCOUNT }}
  TF_VAR_bootstrap_git_repo_ssh_url: ${{ vars.BOOTSTRAP_GIT_REPO_SSH_URL }}
  TF_VAR_bootstrap_git_deploy_key_secret_name: ${{ vars.BOOTSTRAP_GIT_DEPLOY_KEY_SECRET_NAME }}

jobs:
  plan:
    name: Terraform Plan
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply')) }}
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: googleCloud

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required workflow variables
        working-directory: .
        run: |
          missing=0
          if [[ -z "${{ vars.GCP_WIF_PROVIDER }}" ]]; then
            echo "Missing required repository/environment variable: GCP_WIF_PROVIDER"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "Missing required repository/environment variable: GCP_SERVICE_ACCOUNT"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" ]]; then
            echo "Missing required repository/environment variable: GCP_PROJECT_ID"
            missing=1
          fi
          if [[ -z "${{ secrets.GCP_BILLING_ACCOUNT_ID }}" ]]; then
            echo "Missing required repository/environment secret: GCP_BILLING_ACCOUNT_ID"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_REGION }}" ]]; then
            echo "Missing required repository/environment variable: GCP_REGION"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_ZONE }}" ]]; then
            echo "Missing required repository/environment variable: GCP_ZONE"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Authenticate to GCP via OIDC (shared identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Validate workflow trust context
        run: |
          expected_repo="${{ github.repository }}"
          actual_repo="${{ github.repository }}"
          if [[ "$actual_repo" != "$expected_repo" ]]; then
            echo "Repository mismatch"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Push trigger must run only on main"
            exit 1
          fi

      - name: Validate shared identity plan-safe permissions
        run: |
          token="$(gcloud auth print-access-token)"
          allowed=$(curl -sS -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${{ vars.GCP_PROJECT_ID }}:testIamPermissions" \
            -d '{"permissions":["compute.instances.get","compute.instances.create","compute.firewalls.get","resourcemanager.projects.setIamPolicy"]}' \
            | jq -r '.permissions[]?')

          if ! echo "$allowed" | grep -q "compute.instances.get"; then
            echo "Shared identity must include compute.instances.get"
            exit 1
          fi

          if ! echo "$allowed" | grep -q "compute.instances.create"; then
            echo "Shared identity must include compute.instances.create"
            exit 1
          fi

          if echo "$allowed" | grep -q "resourcemanager.projects.setIamPolicy"; then
            echo "Shared identity must not include unrelated admin permissions"
            exit 1
          fi

          # Budget read access is checked by listing budgets on the billing account.
          if ! gcloud billing budgets list \
            --billing-account="${{ secrets.GCP_BILLING_ACCOUNT_ID }}" \
            --limit=1 \
            --format="value(name)" >/dev/null; then
            echo "Shared identity must include billing.resourcebudgets.read"
            exit 1
          fi

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          : "${TF_STATE_BUCKET:?Set GCP_TF_STATE_BUCKET to the existing state bucket}"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_budget_currency_code: ${{ vars.GCP_BUDGET_CURRENCY_CODE }}
        run: |
          : "${TF_VAR_budget_currency_code:?Set GCP_BUDGET_CURRENCY_CODE to the billing account currency}"
          terraform plan -input=false -lock-timeout=300s -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="billing_account_id=${{ secrets.GCP_BILLING_ACCOUNT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="zone=${{ vars.GCP_ZONE }}"

      - name: Guard VM replacement
        env:
          ALLOW_VM_REPLACEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_vm_replacement }}
        run: |
          set -euo pipefail
          vm_replacement="$(terraform show -json tfplan | jq -r '
            any(.resource_changes[]?;
              .type == "google_compute_instance" and
              (.change.actions | index("delete") != null) and
              (.change.actions | index("create") != null)
            )')"
          if [[ "$vm_replacement" == "true" && "$ALLOW_VM_REPLACEMENT" != "true" ]]; then
            echo "::error::Plan would replace a VM. Back up persistent data, review the plan, then manually dispatch with allow_vm_replacement=true only when ready."
            exit 1
          fi

      - name: Upload Terraform plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcp-vm-tfplan
          path: googleCloud/tfplan

  apply:
    name: Terraform Apply
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - plan
    defaults:
      run:
        working-directory: googleCloud


    steps:
      - name: Enforce apply from main and production workflow ref
        if: ${{ github.event.inputs.enforce_main_guard != 'false' }}
        working-directory: .
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Apply is only allowed from refs/heads/main"
            exit 1
          fi

          expected_workflow_ref="${{ github.repository }}/.github/workflows/gcp-vm-deploy.yml@refs/heads/main"
          if [[ "${{ github.workflow_ref }}" != "$expected_workflow_ref" ]]; then
            echo "Apply is only allowed from workflow ref: $expected_workflow_ref"
            echo "Actual workflow ref: ${{ github.workflow_ref }}"
            exit 1
          fi

      - name: Guard override notice
        if: ${{ github.event.inputs.enforce_main_guard == 'false' }}
        working-directory: .
        run: |
          echo "WARNING: apply main/workflow guard bypassed for this manual run"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required workflow variables
        working-directory: .
        run: |
          missing=0
          if [[ -z "${{ vars.GCP_WIF_PROVIDER }}" ]]; then
            echo "Missing required repository/environment variable: GCP_WIF_PROVIDER"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "Missing required repository/environment variable: GCP_SERVICE_ACCOUNT"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" ]]; then
            echo "Missing required repository/environment variable: GCP_PROJECT_ID"
            missing=1
          fi
          if [[ -z "${{ secrets.GCP_BILLING_ACCOUNT_ID }}" ]]; then
            echo "Missing required repository/environment secret: GCP_BILLING_ACCOUNT_ID"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_REGION }}" ]]; then
            echo "Missing required repository/environment variable: GCP_REGION"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_ZONE }}" ]]; then
            echo "Missing required repository/environment variable: GCP_ZONE"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Authenticate to GCP via OIDC (shared identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Validate shared identity apply permissions
        run: |
          token="$(gcloud auth print-access-token)"
          allowed=$(curl -sS -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${{ vars.GCP_PROJECT_ID }}:testIamPermissions" \
            -d '{"permissions":["compute.instances.create","compute.instances.get","compute.firewalls.create","resourcemanager.projects.setIamPolicy"]}' \
            | jq -r '.permissions[]?')

          if ! echo "$allowed" | grep -q "compute.instances.create"; then
            echo "Shared identity must include compute.instances.create"
            exit 1
          fi

          if ! echo "$allowed" | grep -q "compute.firewalls.create"; then
            echo "Shared identity must include compute.firewalls.create"
            exit 1
          fi


          if echo "$allowed" | grep -q "resourcemanager.projects.setIamPolicy"; then
            echo "Shared identity must not include unrelated admin permissions"
            exit 1
          fi

          # Ensure billing budget API access is present before apply.
          if ! gcloud billing budgets list \
            --billing-account="${{ secrets.GCP_BILLING_ACCOUNT_ID }}" \
            --limit=1 \
            --format="value(name)" >/dev/null; then
            echo "Shared identity must include billing budget API access"
            exit 1
          fi

      - name: Download Terraform plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcp-vm-tfplan
          path: googleCloud

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          : "${TF_STATE_BUCKET:?Set GCP_TF_STATE_BUCKET to the existing state bucket}"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=300s -auto-approve tfplan

      - name: Resolve VM target
        working-directory: .
        env:
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
        run: |
          VM_NAME="${GCP_VM_NAME:-gcp-debian-free-tier-vm}"
          echo "VM_NAME=$VM_NAME" >> "$GITHUB_ENV"
          echo "PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "ZONE=${{ vars.GCP_ZONE }}" >> "$GITHUB_ENV"

      - name: Verify bootstrap completion
        working-directory: .
        run: |
          ./googleCloud/bootstrap-readiness.sh "$VM_NAME" "$PROJECT_ID" "$ZONE"

      - name: Configure rclone Dropbox remote on VM
        working-directory: .
        env:
          DROPBOX_AUTH_TOKEN: ${{ secrets.DROPBOX_AUTH_TOKEN }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DROPBOX_AUTH_TOKEN" || -z "$DROPBOX_REFRESH_TOKEN" ]]; then
            echo "::warning::Dropbox secrets missing; skipping rclone setup on the VM"
            exit 0
          fi
          # Send tokens on stdin, followed by this commit's script, so neither
          # appears in a command line on the runner or the VM.
          {
            printf '%s\n' "$DROPBOX_AUTH_TOKEN" | base64 -w0; echo
            printf '%s\n' "$DROPBOX_REFRESH_TOKEN" | base64 -w0; echo
            cat scripts/host/configure-rclone.sh
          } | gcloud compute ssh "$VM_NAME" --project "$PROJECT_ID" --zone "$ZONE" \
            --command 'sudo bash -c '"'"'
              set -euo pipefail
              read -r token64
              read -r refresh64
              DROPBOX_AUTH_TOKEN="$(printf %s "$token64" | base64 -d | tr -d "\n")"
              DROPBOX_REFRESH_TOKEN="$(printf %s "$refresh64" | base64 -d | tr -d "\n")"
              export DROPBOX_AUTH_TOKEN DROPBOX_REFRESH_TOKEN
              unset token64 refresh64
              exec bash -s
            '"'"''

      - name: Verify Docker status
        working-directory: .
        run: |
          if gcloud compute ssh "$VM_NAME" --project "$PROJECT_ID" --zone "$ZONE" \
            --command "sudo systemctl is-active --quiet docker"; then
            echo "[verify] Docker is running"
          else
            echo "::warning::Docker is not running"
          fi

  configure-tailscale:
    name: Configure Tailscale and DuckDNS
    needs: apply
    uses: ./.github/workflows/gcp-duckdns-update.yml
    secrets:
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILSCALE_EPHEMERAL_AUTH_KEY: ${{ secrets.TAILSCALE_EPHEMERAL_AUTH_KEY }}

  restore-npm:
    name: Restore NPM
    needs: apply
    uses: ./.github/workflows/gcp-npm-restore.yml
    with:
      force: true
    secrets:
      DROPBOX_AUTH_TOKEN: ${{ secrets.DROPBOX_AUTH_TOKEN }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  restore-freshrss:
    name: Restore FreshRSS
    needs: [apply, restore-npm]
    uses: ./.github/workflows/gcp-freshrss-restore.yml
    with:
      force: true
    secrets:
      DROPBOX_AUTH_TOKEN: ${{ secrets.DROPBOX_AUTH_TOKEN }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  restore-vaultwarden:
    name: Restore Vaultwarden
    needs: [apply, restore-npm]
    uses: ./.github/workflows/gcp-vaultwarden-restore.yml
    with:
      force: true
    secrets:
      DROPBOX_AUTH_TOKEN: ${{ secrets.DROPBOX_AUTH_TOKEN }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  restore-firefly:
    name: Restore Firefly
    needs: [apply, restore-npm]
    uses: ./.github/workflows/gcp-firefly-restore.yml
    with:
      force: true
    secrets:
      DROPBOX_AUTH_TOKEN: ${{ secrets.DROPBOX_AUTH_TOKEN }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      FIREFLY_APP_KEY: ${{ secrets.FIREFLY_APP_KEY }}
      FIREFLY_DB_USERNAME: ${{ secrets.FIREFLY_DB_USERNAME }}
      FIREFLY_DB_PASSWORD: ${{ secrets.FIREFLY_DB_PASSWORD }}
      FIREFLY_STATIC_CRON_TOKEN: ${{ secrets.FIREFLY_STATIC_CRON_TOKEN }}

  restore-watchtower:
    name: Restore Watchtower
    needs: [apply, restore-npm]
    uses: ./.github/workflows/gcp-watchtower-restore.yml

  teardown:
    name: Terraform Teardown
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: googleCloud

    steps:
      - name: Enforce destroy from main and production workflow ref
        if: ${{ github.event.inputs.enforce_main_guard != 'false' }}
        working-directory: .
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Destroy is only allowed from refs/heads/main"
            exit 1
          fi

          expected_workflow_ref="${{ github.repository }}/.github/workflows/gcp-vm-deploy.yml@refs/heads/main"
          if [[ "${{ github.workflow_ref }}" != "$expected_workflow_ref" ]]; then
            echo "Destroy is only allowed from workflow ref: $expected_workflow_ref"
            echo "Actual workflow ref: ${{ github.workflow_ref }}"
            exit 1
          fi

      - name: Guard override notice
        if: ${{ github.event.inputs.enforce_main_guard == 'false' }}
        working-directory: .
        run: |
          echo "WARNING: destroy main/workflow guard bypassed for this manual run"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required workflow variables
        working-directory: .
        run: |
          missing=0
          if [[ -z "${{ vars.GCP_WIF_PROVIDER }}" ]]; then
            echo "Missing required repository/environment variable: GCP_WIF_PROVIDER"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "Missing required repository/environment variable: GCP_SERVICE_ACCOUNT"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" ]]; then
            echo "Missing required repository/environment variable: GCP_PROJECT_ID"
            missing=1
          fi
          if [[ -z "${{ secrets.GCP_BILLING_ACCOUNT_ID }}" ]]; then
            echo "Missing required repository/environment secret: GCP_BILLING_ACCOUNT_ID"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_REGION }}" ]]; then
            echo "Missing required repository/environment variable: GCP_REGION"
            missing=1
          fi
          if [[ -z "${{ vars.GCP_ZONE }}" ]]; then
            echo "Missing required repository/environment variable: GCP_ZONE"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Authenticate to GCP via OIDC (shared identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Validate shared identity destroy permissions
        run: |
          token="$(gcloud auth print-access-token)"
          allowed=$(curl -sS -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${{ vars.GCP_PROJECT_ID }}:testIamPermissions" \
            -d '{"permissions":["compute.instances.delete","compute.firewalls.delete","resourcemanager.projects.setIamPolicy"]}' \
            | jq -r '.permissions[]?')

          if ! echo "$allowed" | grep -q "compute.instances.delete"; then
            echo "Shared identity must include compute.instances.delete"
            exit 1
          fi

          if ! echo "$allowed" | grep -q "compute.firewalls.delete"; then
            echo "Shared identity must include compute.firewalls.delete"
            exit 1
          fi

          if echo "$allowed" | grep -q "resourcemanager.projects.setIamPolicy"; then
            echo "Shared identity must not include unrelated admin permissions"
            exit 1
          fi

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          : "${TF_STATE_BUCKET:?Set GCP_TF_STATE_BUCKET to the existing state bucket}"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform destroy
        env:
          TF_VAR_budget_currency_code: ${{ vars.GCP_BUDGET_CURRENCY_CODE }}
        run: |
          : "${TF_VAR_budget_currency_code:?Set GCP_BUDGET_CURRENCY_CODE to the billing account currency}"
          terraform destroy -input=false -lock-timeout=300s -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="billing_account_id=${{ secrets.GCP_BILLING_ACCOUNT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="zone=${{ vars.GCP_ZONE }}"
