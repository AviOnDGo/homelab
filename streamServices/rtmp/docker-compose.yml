services:
  rtmp:
    image: tiangolo/nginx-rtmp@sha256:0fcc46e6196911c985b6b9ee15834f370dc6450559455b09b39b40144ca44c45
    container_name: rtmp
    restart: unless-stopped
    # ports:
    #   - 127.0.0.1:1935:1935
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - stream_network

networks:
  stream_network:
    external: true
    name: stream_network