services:
  firefly:
    image: fireflyiii/core:latest
    hostname: app
    container_name: firefly
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: firefly
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      STATIC_CRON_TOKEN_FILE: /run/secrets/firefly_cron_token
    secrets:
      - firefly_cron_token
    # volumes:
    #   - firefly:/var/www/html/storage/upload
    # ports:
    #   - 9021:8080  # Exposed via Nginx Proxy Manager instead
    depends_on:
      - firefly-db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No resource limits - Google Cloud free tier VM runs many services
    # Linux OOM killer will protect against true runaways
    restart: always

  firefly-db:
    image: postgres
    hostname: db
    container_name: firefly-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - firefly_postgresdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No resource limits - Google Cloud free tier VM runs many services
    # Linux OOM killer will protect against true runaways
    restart: always

  firefly-cron:
    # Provide the same 32-character STATIC_CRON_TOKEN to both app and cron.
    image: alpine
    restart: always
    container_name: firefly-cron
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      TZ: UTC
    secrets:
      - firefly_cron_token
    depends_on:
      - firefly
      - firefly-db
    # No resource limits - Google Cloud free tier VM runs many services
    # Cron job runs daily at 3 AM, minimal footprint
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache tzdata
        ln -sf "/usr/share/zoneinfo/$${TZ}" /etc/localtime
        STATIC_CRON_TOKEN="$$(cat /run/secrets/firefly_cron_token)"
        if [ "$${#STATIC_CRON_TOKEN}" -ne 32 ]; then
          echo "STATIC_CRON_TOKEN must be exactly 32 characters." >&2
          exit 1
        fi
        echo "0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$${STATIC_CRON_TOKEN}; echo" | crontab -
        exec crond -f -L /dev/stdout

# Volumes are not external for postgres. This allows the volume to be created with 'docker compose create' with proper permissions. Then use it to restore.
volumes:
  firefly_postgresdata:
    name: firefly_postgresdata

secrets:
  firefly_cron_token:
    environment: STATIC_CRON_TOKEN

networks:
  default:
    name: finance_network
    external: true
