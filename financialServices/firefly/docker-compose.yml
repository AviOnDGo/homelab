services:
  firefly:
    image: fireflyiii/core:latest
    hostname: app
    container_name: firefly
    # volumes:
    #   - firefly:/var/www/html/storage/upload
    env_file: .env
    # ports:
    #   - 9021:8080  # Exposed via Nginx Proxy Manager instead
    depends_on:
      - firefly-db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No resource limits - Google Cloud free tier VM runs many services
    # Linux OOM killer will protect against true runaways
    restart: always

  firefly-db:
    image: postgres
    hostname: db
    container_name: firefly-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    env_file: .db.env
    volumes:
      - firefly_postgresdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No resource limits - Google Cloud free tier VM runs many services
    # Linux OOM killer will protect against true runaways
    restart: always

  firefly-cron:
    #
    # To make this work, set STATIC_CRON_TOKEN in your .env file or as an environment variable and replace REPLACEME below
    # The STATIC_CRON_TOKEN must be *exactly* 32 characters long
    # Low resource service - cron scheduler only runs daily at 3 AM
    #
    image: alpine
    restart: always
    container_name: firefly-cron
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    env_file: .env
    depends_on:
      - firefly
      - firefly-db
    # No resource limits - Google Cloud free tier VM runs many services
    # Cron job runs daily at 3 AM, minimal footprint
    command: sh -c "
      apk add tzdata
      && ln -s /usr/share/zoneinfo/${TZ} /etc/localtime
      | echo \"0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\"
      | crontab -
      && crond -f -L /dev/stdout"

# Volumes are not external for postgres. This allows the volume to be created with 'docker compose create' with proper permissions. Then use it to restore.
volumes:
  firefly_postgresdata:
    name: firefly_postgresdata

networks:
  default:
    name: finance_network
    external: true
