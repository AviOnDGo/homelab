services:
  filedata-backup:
    build: .
    image: homelab/filedata-backup:local
    container_name: filedata-backup
    env_file:
      - .env
    volumes:
      # Mount volumes to backup (read-only) — remote-profile services only
      ## Knowledge Services
      - freshrss_filedata:/backup-sources/freshrss:ro
      ## Security Services
      - npm_filedata:/backup-sources/npm:ro
      - pihole_filedata:/backup-sources/pihole:ro
      - vaultwarden_filedata:/backup-sources/vaultwarden:ro
      # GPG secrets
      - gpg-secrets:/run/secrets:ro

    command: >
      sh -c "
      /usr/local/bin/configure-rclone.sh &&
      echo '# Crontab for filedata backups' > /etc/crontabs/root &&
      echo '# Knowledge Services' >> /etc/crontabs/root &&
      echo '${FRESHRSS_CRON_SCHEDULE} /bin/bash /usr/local/bin/backup-script.sh freshrss >> /var/log/cron_freshrss.log 2>&1' >> /etc/crontabs/root &&
      echo '# Security Services' >> /etc/crontabs/root &&
      echo '${NPM_CRON_SCHEDULE} /bin/bash /usr/local/bin/backup-script.sh npm >> /var/log/cron_npm.log 2>&1' >> /etc/crontabs/root &&
      echo '${PIHOLE_CRON_SCHEDULE} /bin/bash /usr/local/bin/backup-script.sh pihole >> /var/log/cron_pihole.log 2>&1' >> /etc/crontabs/root &&
      echo '${VAULTWARDEN_CRON_SCHEDULE} /bin/bash /usr/local/bin/backup-script.sh vaultwarden >> /var/log/cron_vaultwarden.log 2>&1' >> /etc/crontabs/root &&
      touch /var/log/cron.log &&
      crond -L /var/log/cron.log &&
      tail -f /var/log/cron.log
      "

    network_mode: bridge
    restart: unless-stopped

volumes:
  ## Knowledge Services
  freshrss_filedata:
    external: true
    name: freshrss_filedata
  ## Security Services
  npm_filedata:
    external: true
    name: npm_filedata
  pihole_filedata:
    external: true
    name: pihole_filedata
  vaultwarden_filedata:
    external: true
    name: vaultwarden_filedata
  gpg-secrets:
    driver: local
