services:
  filedata-backup:
    build: .
    image: homelab/filedata-backup:local
    container_name: filedata-backup
    env_file:
      - .env
    environment:
      TZ: UTC
    volumes:
      - gpg-secrets:/run/secrets:ro
    command: >
      sh -c "echo 'ERROR: Run ./start-backup.sh with a host profile' >&2; exit 1"
    network_mode: bridge
    restart: unless-stopped

volumes:
  gpg-secrets:
    driver: local
