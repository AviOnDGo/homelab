services:
  db-backup:
    build: .
    image: homelab/db-backup:local
    container_name: db-backup
    networks:
      - finance_network
      - security_network
    env_file: .env
    volumes:
      # Mount postgresdata volumes (read-only) — remote-profile services only
      ## Financial Services
      - firefly_postgresdata:/var/lib/postgresql/firefly:ro
      ## Security Services
      - firefoxsync_postgresdata:/var/lib/postgresql/firefoxsync:ro

      # Mount secrets volume for GPG passphrase
      - gpg-secrets:/run/secrets:ro


    command: >
      sh -c "
      echo '# Crontab for database backups' > /etc/crontabs/root &&
      echo '# Financial Services' >> /etc/crontabs/root &&
      echo '${FIREFLY_CRON_SCHEDULE} sh /usr/local/bin/backup-script.sh firefly' >> /etc/crontabs/root &&
      echo '# Security Services' >> /etc/crontabs/root &&
      echo '${FIREFOXSYNC_CRON_SCHEDULE} sh /usr/local/bin/backup-script.sh firefoxsync' >> /etc/crontabs/root &&
      crond -f -L /dev/stdout
      "

    restart: unless-stopped

networks:
  finance_network:
    name: finance_network
    external: true
  security_network:
    name: security_network
    external: true

volumes:
  ## Financial Services
  firefly_postgresdata:
    name: firefly_postgresdata
    external: true
  ## Security Services
  firefoxsync_postgresdata:
    name: firefoxsync_postgresdata
    external: true
  gpg-secrets:
    driver: local
