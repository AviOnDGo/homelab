services:
  jackett:
    image: linuxserver/jackett
    container_name: jackett
    # ports:
    #  - 9117:9117
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      http_proxy: http://gluetun:8888
      https_proxy: http://gluetun:8888
      no_proxy: localhost,127.0.0.1
    volumes:
      - filedata:/config
      - "${HOME}/.media/.downloads:/downloads"
    # Set the network mode to gluetun only if the service is initiated
    # network_mode: service:gluetun
    networks:
      - default
      - security_network
    restart: unless-stopped

networks:
  default:
    name: media_network
    external: true
  security_network:
    name: security_network
    external: true

volumes:
  filedata:
    external: true
    name: jackett_filedata