# version: "3"
services:

  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: invidious
    # image: quay.io/invidious/invidious:latest-arm64 # ARM64/AArch64 devices
    restart: unless-stopped
    env_file: .env
    # Remove "127.0.0.1:" if used from an external IP
    ports:
      - 3001:3000
    environment:
      http_proxy: http://gluetun:8888
      https_proxy: http://gluetun:8888
      no_proxy: localhost,127.0.0.1
      # Please read the following file for a comprehensive list of all available
      # configuration options and their associated syntax:
      # https://github.com/iv-org/invidious/blob/master/config/config.example.yml
      INVIDIOUS_CONFIG: |
        db:
          dbname: ${POSTGRES_DB}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        # URL used for the internal communication between invidious and invidious companion
        # There is no need to change that except if Invidious companion does not run on the same docker compose file.
        - private_url: "http://companion:8282/companion"
        # IT is NOT recommended to use the same key as HMAC KEY. Generate a new key!
        # Use the key generated in the 2nd step
        invidious_companion_key: "${INVIDIOUS_COMPANION_KEY}"
        # external_port:
        # domain:
        # https_only: false
        # statistics_enabled: false
        hmac_key: "${INVIDIOUS_HMAC_KEY}"
    # healthcheck:
    #   test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
    #   interval: 30s
    #   timeout: 5s
    #   retries: 2
    # logging:
    #   options:
    #     max-size: "1G"
    #     max-file: "4"
    depends_on:
      - invidious-db
    networks:
      - default
      - security_network

  companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: invidious-companion
    env_file: .env
    environment:
       - SERVER_SECRET_KEY=${INVIDIOUS_COMPANION_KEY}
    restart: unless-stopped
    # Uncomment only if you have configured "public_url" for Invidious companion
    # Or if you want to use Invidious companion as an API in your program.
    # Remove "127.0.0.1:" if used from an external IP
    #ports:
    #  - "127.0.0.1:8282:8282"
    # logging:
    #   options:
    #     max-size: "1G"
    #     max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    # cache for youtube library
    # volumes:
    #   - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    container_name: invidious-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgresdata:/var/lib/postgresql
      # - ./config/sql:/config/sql
      # - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    # environment:
    #   POSTGRES_DB: ${POSTGRES_DB}
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

volumes:
  postgresdata:
    name: invidious_postgresdata
  # companioncache:

networks:
  default:
    name: media_network
    external: true
  security_network:
    external: true
    name: security_network