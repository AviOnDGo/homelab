services:
  transmission:
    image: linuxserver/transmission
    container_name: transmission
    env_file:
      - .env
    # ports:
    #  - 9091:9091
    #  - 51413:51413
    #  - 51413:51413/udp
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      http_proxy: http://gluetun:8888
      https_proxy: http://gluetun:8888
      no_proxy: localhost,127.0.0.1
    volumes:
      - filedata:/config
      - "${HOME}/.media/.downloads:/downloads"
      - "${HOME}/.media/.watch:/watch"
    # Set the network mode to gluetun only if the service is initiated
    # network_mode: service:gluetun
    networks:
      - default
      - security_network
    restart: unless-stopped

networks:
  default:
    name: media_network
    external: true
  security_network:
    name: security_network
    external: true

volumes:
  filedata:
    external: true
    name: transmission_filedata