services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    # ports:
    #   - "8989:8989"
    environment:
      http_proxy: http://gluetun:8888
      https_proxy: http://gluetun:8888
      no_proxy: localhost,127.0.0.1
    volumes:
      - filedata:/config
      - "${HOME}/.media/.downloads:/downloads"
      - "${HOME}/.media/TVSeries:/tv"
    networks:
      - default
      - security_network
    restart: unless-stopped

networks:
  default:
    external: true
    name: media_network
  security_network:
    external: true
    name: security_network

volumes:
  filedata:
    external: true
    name: sonarr_filedata