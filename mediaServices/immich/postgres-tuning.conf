# PostgreSQL tuning overrides for the Immich database container.
# Mounted read-only at /etc/postgresql/postgresql.conf inside immich-db.
# Values are tuned for large vector/image-metadata workloads on the homelab host.
# Adjust shared_buffers / effective_cache_size if the host RAM changes.

# Memory
shared_buffers = 512MB              # ~25% of available RAM
effective_cache_size = 1536MB       # ~75% of available RAM
work_mem = 64MB                     # Sort memory per operation; benefits vector similarity queries

# Checkpoint tuning
checkpoint_completion_target = 0.9  # Spread WAL flush over 90% of checkpoint interval
max_wal_size = 2GB                  # Reduce checkpoint frequency during bulk photo ingestion

# Storage
random_page_cost = 1.1              # Assume fast SSD storage (prefer index scans)
