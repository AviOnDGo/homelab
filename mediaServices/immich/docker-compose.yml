services:
  # Immich Services
  immich:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    extends:
      file: hwaccel.transcoding.yml
      service: nvenc # NVIDIA-backed transcoding for hosts with the NVIDIA Container Toolkit
    volumes:
      - immich_data:/data
      - immich_library:/data/library
      - immich_profile:/data/profile
      - immich_upload:/data/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      DB_HOSTNAME: immich-db
      REDIS_HOSTNAME: immich-redis
    # ports:
    #   - '2283:2283'  # Exposed via Nginx Proxy Manager instead
    depends_on:
      - immich-redis
      - immich-db
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-ml:
    container_name: immich-ml
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    # NOTE: If Ollama is running on the same GPU, switch back to the CPU image (remove -cuda)
    # to avoid CUBLAS_STATUS_ALLOC_FAILED errors (GTX 1650 Ti only has 4 GB VRAM).
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
      file: hwaccel.ml.yml
      service: cuda # NVIDIA-backed inference for hosts with the NVIDIA Container Toolkit
    volumes:
      - immich_model_cache:/cache
    env_file:
      - .env
    networks:
      default:
        aliases:
          - immich-machine-learning
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    command: valkey-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  immich-db:
    container_name: immich-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich_postgresdata:/var/lib/postgresql
      # postgres-tuning.conf is applied via -c flags below to avoid sed/bind-mount conflict
      # with the Immich image entrypoint (cp -n + sed -i on /etc/postgresql/postgresql.conf).
      # - ./postgres-tuning.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=2GB
      -c random_page_cost=1.1
    networks:
      default:
        aliases:
          - database
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false

volumes:
  immich_data:
    name: immich_data
  immich_model_cache:
    name: immich_model_cache
  immich_postgresdata:
    name: immich_postgresdata
  immich_library:
    external: true
    name: immich_library
  immich_profile:
    external: true
    name: immich_profile
  immich_upload:
    external: true
    name: immich_upload

networks:
  default:
    name: media_network
    external: true
