services:
  watchtower-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    container_name: watchtower-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      POST: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"

  watchtower:
    image: nickfedor/watchtower@sha256:617a7d5523280cb73adac4d7977604afbe66b7ea86211f2ae0cbfa2043041d61
    container_name: watchtower
    restart: unless-stopped
    depends_on:
      - watchtower-socket-proxy
    env_file:
      - .env
    environment:
      DOCKER_HOST: tcp://watchtower-socket-proxy:2375
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
      WATCHTOWER_NO_SELF_UPDATE: "true"
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.44"

networks:
  default:
    name: security_network
    external: true
