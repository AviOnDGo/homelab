services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      SIGNUPS_ALLOWED: "false"
    volumes:
      - filedata:/data
    # Port exposed for direct access - use npm proxy instead for secure access
    # ports:
    #   - 9010:80
    restart: unless-stopped

volumes:
  filedata:
    name: vaultwarden_filedata # Named volume for Vaultwarden data persistence
    external: true # Indicates that this volume is managed outside of Docker Compose

networks:
  default:
    name: security_network
    external: true