name: affine
services:
  affine:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine
    ports:
      - '${PORT:-3010}:3010'  # Access via Nginx Proxy Manager
    depends_on:
      affine-cache:
        condition: service_healthy
      affine-db:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      # custom configurations
      - affine_filedata:/root/.affine
    env_file:
      - .env
    environment:
      - REDIS_SERVER_HOST=affine-cache
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@affine-db:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false
      - TZ=UTC
    networks:
      - knowledge_network
    restart: unless-stopped

  affine_migration:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_migration
    volumes:
      # custom configurations
      - affine_filedata:/root/.affine
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    env_file:
      - .env
    environment:
      - REDIS_SERVER_HOST=affine-cache
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@affine-db:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false
      - TZ=UTC
    networks:
      - knowledge_network
    depends_on:
      affine-db:
        condition: service_healthy
      affine-cache:
        condition: service_healthy

  affine-cache:
    image: redis:7.2-alpine
    container_name: affine-cache
    environment:
      - TZ=UTC
    networks:
      - knowledge_network
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  affine-db:
    image: pgvector/pgvector:pg16
    container_name: affine-db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - affine_postgresdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: UTC
    networks:
      - knowledge_network
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', "${DB_USERNAME}", '-d', "${DB_DATABASE:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  affine-mcp:
    image: ghcr.io/dawncr0w/affine-mcp-server:latest
    container_name: affine-mcp
    environment:
      MCP_TRANSPORT: 'http'
      AFFINE_BASE_URL: ${AFFINE_BASE_URL}
      AFFINE_EMAIL: ${AFFINE_EMAIL}
      AFFINE_PASSWORD: ${AFFINE_PASSWORD}
      AFFINE_MCP_AUTH_MODE: 'bearer'
      AFFINE_MCP_HTTP_TOKEN: ${AFFINE_MCP_HTTP_TOKEN}
    networks:
      - knowledge_network
    restart: unless-stopped

networks:
  knowledge_network:
    external: true
    name: knowledge_network

volumes:
  affine_filedata:
    external: true
  affine_postgresdata:
    name: affine_postgresdata
