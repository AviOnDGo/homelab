name: freshrss

services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    # ports:
    #   - '80:80'  # Access via Nginx Proxy Manager
    environment:
      - TZ=UTC
      - CRON_MIN=*/15
    volumes:
      - freshrss_filedata:/var/www/FreshRSS
    networks:
      - knowledge_network
    healthcheck:
      test: ["CMD", "php", "/var/www/FreshRSS/cli/health.php"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped

networks:
  knowledge_network:
    external: true
    name: knowledge_network

volumes:
  freshrss_filedata:
    external: true
    name: freshrss_filedata
